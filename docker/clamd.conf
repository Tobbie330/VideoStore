# clamd config for the scanner container. The app streams each upload to
# clamd over TCP (INSTREAM); the scanner never sees the uploads volume.
Foreground no
LogTime yes
LogFile /dev/stdout
PidFile /tmp/clamd.pid
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LocalSocket /run/clamav/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav

# Must be >= MAX_UPLOAD_MB. Files larger than these limits are reported as
# "Heuristics.Limits.Exceeded" (AlertExceedsMax) instead of silently passing.
StreamMaxLength 4000M
MaxFileSize 4000M
MaxScanSize 4000M
AlertExceedsMax yes

MaxThreads 4
ReadTimeout 600
CommandReadTimeout 30
SendBufTimeout 600
